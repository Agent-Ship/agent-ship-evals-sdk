[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "agentship-otel-evals"
version = "0.1.0"
description = "OpenTelemetry-based evaluation SDK for AI agents and LLMs, using OTel GenAI semantic conventions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Agent-Ship" }]
keywords = ["opentelemetry", "otel", "evals", "evaluation", "llm", "agents", "genai", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-semantic-conventions>=0.48b0",
    "typing-extensions>=4.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
llm-judge = [
    "openai>=1.40.0",
]

[project.urls]
Homepage = "https://github.com/Agent-Ship/agentship-otel-evals"
Repository = "https://github.com/Agent-Ship/agentship-otel-evals"
Issues = "https://github.com/Agent-Ship/agentship-otel-evals/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentship_otel_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "unit: unit tests",
    "integration: integration tests that may hit external systems",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
